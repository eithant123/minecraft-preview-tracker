<!DOCTYPE html>
<html lang="es" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WaitRadar — Minecraft Preview</title>
<meta name="description" content="Estado en vivo del beta de Minecraft Preview en TestFlight. Avisos gratis por Telegram cuando se abre un cupo.">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0c1015">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WaitRadar">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#0c1015; --panel:#12181f; --panel2:#0e141a;
    --grass:#5b9c3e; --grass-dark:#3d6b2a; --dirt:#7a5230; --stone:#5a626b;
    --alert:#e0453a; --alert-dim:#c0392b; --sky:#4a90d9; --gold:#e8b93e;
    --text:#e8ecef; --dim:#7d8790; --line:#232d38;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--night);
    color:var(--text); font-family:'JetBrains Mono', monospace;
    display:flex; flex-direction:column; align-items:center;
  }

  header{
    width:100%; max-width:900px;
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 20px; border-bottom:1px solid var(--line);
    flex-wrap:wrap; gap:8px;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand .blocks{ display:flex; gap:2px; }
  .brand .blocks span{ width:10px;height:10px; background:var(--grass); }
  .brand .blocks span:nth-child(2){background:var(--dirt);}
  .brand .blocks span:nth-child(3){background:var(--stone);}
  .brand-name{ font-family:'Press Start 2P', monospace; font-size:11px; color:var(--text); letter-spacing:.03em; }
  .brand-name b{ color:var(--gold); }
  .live{ display:flex; align-items:center; gap:6px; font-size:11px; color:var(--dim); }
  .live-dot{ width:7px;height:7px; border-radius:50%; background:var(--stone); box-shadow:0 0 8px var(--stone); animation:pulse 1.6s infinite; }
  .live-dot.up{ background:var(--grass); box-shadow:0 0 8px var(--grass); }
  .live-dot.down{ background:var(--alert); box-shadow:0 0 8px var(--alert); }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.4;} }
  .updated{ font-size:10.5px; color:var(--dim); }

  .header-right{ display:flex; align-items:center; gap:12px; }
  .lang-switch{ display:flex; gap:4px; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:2px; }
  .lang-btn{
    font-size:10.5px; font-weight:700; padding:4px 8px; border-radius:6px; cursor:pointer;
    color:var(--dim); background:transparent; border:none; font-family:'JetBrains Mono', monospace;
  }
  .lang-btn.active{ background:var(--grass-dark); color:#fff; }

  main{ width:100%; max-width:900px; padding:20px; }

  .row{ display:grid; grid-template-columns: 1fr 1.6fr 1fr; gap:14px; margin-bottom:14px; }
  @media (max-width:720px){ .row{ grid-template-columns:1fr; } }

  .card{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px; }
  .card-label{ font-size:10px; color:var(--dim); letter-spacing:.05em; text-transform:uppercase; margin-bottom:10px; }

  .big-num{ font-family:'Press Start 2P', monospace; font-size:34px; line-height:1; margin-bottom:6px; }
  .big-num.full{ color:var(--alert); }
  .big-num.open{ color:var(--grass); }
  .big-sub{ font-size:11px; color:var(--dim); }

  .status-pill{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .status-dot{ width:12px;height:12px; border-radius:50%; }
  .status-dot.full{ background:var(--alert); box-shadow:0 0 12px var(--alert); }
  .status-dot.open{ background:var(--grass); box-shadow:0 0 12px var(--grass); }
  .status-headline{ font-size:16px; font-weight:700; }
  .status-headline.full{ color:var(--alert); }
  .status-headline.open{ color:var(--grass); }
  .status-headline.pulse{ animation: textPulse 2s ease-in-out infinite; }
  @keyframes textPulse{ 0%,100%{ opacity:1; } 50%{ opacity:.6; } }
  .status-desc{ font-size:11px; color:var(--dim); line-height:1.5; }
  .status-desc a{ color:var(--sky); }

  .chart-title{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; }
  .chart-title span{ font-size:10px; color:var(--dim); }
  .axis-label{ font-size:9px; color:var(--dim); font-family:'JetBrains Mono', monospace; }

  .timeline{ display:flex; gap:2px; align-items:flex-end; height:56px; margin-bottom:6px; }
  .tl-bar{ flex:1; height:100%; border-radius:3px; background:var(--line); transition:background .2s; }
  .tl-bar.open{ background:var(--grass); }
  .tl-bar.full{ background:var(--alert); }

  .timeline-legend{ display:flex; gap:16px; margin-top:10px; font-size:10px; color:var(--dim); }
  .timeline-legend .dot{ display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:5px; }
  .timeline-legend .dot.open{ background:var(--grass); }
  .timeline-legend .dot.full{ background:var(--alert); }

  .bottom-row{ display:flex; gap:10px; align-items:center; justify-content:space-between; flex-wrap:wrap;
    background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 18px; margin-bottom:20px; }
  .bell{ display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--dim); }
  .bell a{ color:var(--sky); text-decoration:none; }
  .share-btn{
    display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700;
    background:rgba(74,144,217,.15); color:var(--sky); border:1px solid rgba(74,144,217,.4);
    padding:12px 18px; border-radius:8px; cursor:pointer;
  }

  .tip-card{ margin-bottom:20px; }
  .tip-text{ font-size:11.5px; color:var(--dim); line-height:1.6; margin-bottom:14px; }
  .tip-buttons{ display:flex; gap:10px; flex-wrap:wrap; }
  .tip-note{ font-size:10px; color:var(--dim); margin-top:10px; line-height:1.5; }
  .yt-card{ background:linear-gradient(160deg, rgba(74,144,217,.10), var(--panel)); border-color:rgba(74,144,217,.35); }
  .yt-header{ display:flex; align-items:center; gap:12px; margin-bottom:12px; }
  .yt-avatar{
    width:42px; height:42px; border-radius:50%; flex-shrink:0;
    background:rgba(74,144,217,.15); border:1px solid rgba(74,144,217,.4);
    display:flex; align-items:center; justify-content:center; font-size:19px;
  }
  .yt-title{ font-size:13px; font-weight:700; color:#fff; }
  .yt-sub{ font-size:10px; color:var(--dim); margin-top:2px; }
  .yt-text{ font-size:11.5px; color:var(--text); line-height:1.6; margin-bottom:14px; }
  .yt-btn{
    display:block; text-align:center; text-decoration:none;
    background:var(--sky); color:#fff; font-weight:700; font-size:12px;
    padding:12px; border-radius:8px;
  }
  .discord-card{ background:linear-gradient(160deg, rgba(88,101,242,.12), var(--panel)); border-color:rgba(88,101,242,.35); margin-bottom:20px; }
  .discord-avatar{
    width:42px; height:42px; border-radius:50%; flex-shrink:0;
    background:rgba(88,101,242,.15); border:1px solid rgba(88,101,242,.4);
    display:flex; align-items:center; justify-content:center; font-size:19px;
  }
  .discord-btn{
    display:block; text-align:center; text-decoration:none;
    background:#5865F2; color:#fff; font-weight:700; font-size:12px;
    padding:12px; border-radius:8px;
  }
  .tip-btn{
    flex:1; min-width:76px; text-align:center; font-size:12.5px; font-weight:700;
    padding:12px 8px; border-radius:8px; cursor:pointer;
    background:rgba(232,185,62,.12); color:var(--gold); border:1px solid rgba(232,185,62,.4);
    transition: background .2s;
    display:block; text-decoration:none;
  }
  .tip-btn:active{ background:rgba(232,185,62,.25); }

  .roadmap-note{ font-size:10.5px; color:var(--dim); text-align:center; margin-bottom:24px; }

  footer{ font-size:10px; color:var(--dim); text-align:center; padding:16px 20px 30px; }
  footer a{ color:var(--sky); text-decoration:none; }

  .load-msg{ text-align:center; color:var(--dim); font-size:11px; padding:60px 20px; }

  .install-bar{
    display:none; align-items:center; justify-content:space-between; gap:12px;
    width:100%; max-width:900px; margin:0 20px 16px; padding:12px 16px;
    background:rgba(91,156,62,.12); border:1px solid rgba(91,156,62,.4); border-radius:10px;
    font-size:11.5px; box-sizing:border-box;
  }
  .install-bar.show{ display:flex; }
  .install-bar span{ color:var(--text); }
  .install-btn{
    flex-shrink:0; font-size:11px; font-weight:700; cursor:pointer;
    background:var(--grass-dark); color:#fff; border:none; border-radius:8px; padding:8px 14px;
  }
  .install-dismiss{ flex-shrink:0; color:var(--dim); cursor:pointer; font-size:14px; padding:4px 8px; }
</style>

};

function getLang(){
  const saved = localStorage.getItem("waitradar_lang");
  if (saved) return saved;
  return navigator.language.startsWith("en") ? "en" : "es";
}
let currentLang = getLang();
function t(key, ...args){
  const val = I18N[currentLang][key];
  return typeof val === "function" ? val(...args) : val;
}

function setLang(lang){
  currentLang = lang;
  localStorage.setItem("waitradar_lang", lang);
  document.getElementById("htmlRoot").lang = lang;
  document.getElementById("langEs").classList.toggle("active", lang === "es");
  document.getElementById("langEn").classList.toggle("active", lang === "en");
  document.getElementById("settingsLink").title = t("settings_title");
  document.getElementById("loadMsg").textContent = t("loading_data");
  document.getElementById("footerText").innerHTML = t("footer", "https://t.me/EithanCupoBot");
  render();
}

document.getElementById("langEs").addEventListener("click", () => setLang("es"));
document.getElementById("langEn").addEventListener("click", () => setLang("en"));

// ---------- Utilidades de fecha ----------
function fmtRelative(iso){
  const then = new Date(iso);
  const diffMs = Date.now() - then.getTime();
  const mins = Math.floor(diffMs / 60000);
  if (mins < 1) return t("rel_seconds");
  if (mins < 60) return t("rel_min", mins);
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return t("rel_hr", hrs);
  const days = Math.floor(hrs / 24);
  return t("rel_day", days);
}

function daysSince(iso){
  const then = new Date(iso);
  const diffMs = Date.now() - then.getTime();
  return Math.floor(diffMs / 86400000);
}

function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString(t("locale"), { day: "2-digit", month: "short" });
}

function fmtExact(iso){
  if (!iso) return "—";
  const d = new Date(iso);
  return d.toLocaleString(t("locale"), { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" });
}

function fmtExactPlus15(iso){
  if (!iso) return "—";
  const d = new Date(new Date(iso).getTime() + 15 * 60000);
  return d.toLocaleTimeString(t("locale"), { hour: "2-digit", minute: "2-digit" });
}

function buildTimeline(history, currentStatus, lastChecked){
  const now = new Date(lastChecked || Date.now());
  const events = (history || [])
    .map(h => ({ status: h.status, at: new Date(h.changed_at) }))
    .sort((a, b) => a.at - b.at);

  const days = [];
  for (let i = 29; i >= 0; i--){
    const dayEnd = new Date(now.getTime() - i * 86400000);
    let statusThatDay = events.length ? events[0].status : currentStatus;
    for (const e of events){
      if (e.at <= dayEnd) statusThatDay = e.status; else break;
    }
    if (i === 0) statusThatDay = currentStatus;
    days.push({ date: dayEnd, status: statusThatDay });
  }
  return days;
}

let cachedData = null;

async function render(){
  const main = document.getElementById("main");
  const liveDot = document.getElementById("liveDot");
  const liveLabel = document.getElementById("liveLabel");
  const updatedLabel = document.getElementById("updatedLabel");

  let data = cachedData;
  if (!data){
    try{
      const res = await fetch(STATUS_URL, { cache: "no-store" });
      if (!res.ok) throw new Error("status.json no encontrado (" + res.status + ")");
      data = await res.json();
      cachedData = data;
    }catch(err){
      main.innerHTML = `<div class="load-msg">${t("error_loading", err.message)}</div>`;
      liveLabel.textContent = t("no_connection");
      return;
    }
  }

  const status = data.status;
  const isOpen = status === "open";
  const history = data.history || [];
  const lastChecked = data.last_checked;

  liveDot.className = "live-dot " + (isOpen ? "up" : "down");
  liveLabel.textContent = t("live_now");
  updatedLabel.textContent = lastChecked ? t("updated", fmtRelative(lastChecked)) : "";

  const lastFullEntry = [...history].reverse().find(h => h.status === "full");
  const lastOpenEntry = [...history].reverse().find(h => h.status === "open");
  let bigNum, bigSub;
  if (isOpen){
    bigNum = lastOpenEntry ? daysSince(lastOpenEntry.changed_at) : 0;
    bigSub = t("days_open_sub");
  } else {
    bigNum = lastFullEntry ? daysSince(lastFullEntry.changed_at) : 0;
    bigSub = t("days_full_sub");
  }

  const timeline = buildTimeline(history, status, lastChecked);
  const barsHtml = timeline.map(d =>
    `<div class="tl-bar ${d.status}" title="${fmtDate(d.date)}: ${d.status === 'full' ? t('legend_full') : t('legend_open')}"></div>`
  ).join("");
  const chartHtml = `
    <div class="timeline">${barsHtml}</div>
    <div style="display:flex; justify-content:space-between;">
      <span class="axis-label">${fmtDate(timeline[0].date)}</span>
      <span class="axis-label">${t("today")}</span>
    </div>
    <div class="timeline-legend">
      <span><i class="dot full"></i> ${t("legend_full")}</span>
      <span><i class="dot open"></i> ${t("legend_open")}</span>
    </div>
  `;

  main.innerHTML = `
    <div class="row">
      <div class="card">
        <div class="card-label">${isOpen ? t("days_open_label") : t("days_full_label")}</div>
        <div class="big-num ${isOpen ? "open" : "full"}">${bigNum}</div>
        <div class="big-sub">${bigSub}</div>
      </div>

      <div class="card">
        <div class="chart-title"><span>${t("chart_title")}</span></div>
        ${chartHtml}
      </div>

      <div class="card">
        <div class="card-label">${t("minecraft_preview")}</div>
        <div class="status-pill">
          <span class="status-dot ${isOpen ? "open" : "full"}"></span>
          <span class="status-headline ${isOpen ? "open" : "full"}${!isOpen ? " pulse" : ""}">${isOpen ? t("status_open") : t("status_full")}</span>
        </div>
        <div class="status-desc">
          ${isOpen ? t("desc_open") : t("desc_full")}

// ---------- Inicialización ----------
setLang(currentLang);

// --- PWA: registrar service worker ---
if ("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js").catch(() => {});
  });
}

// --- PWA: botón de instalar (Android/desktop Chrome) ---
let deferredPrompt = null;
const installBar = document.getElementById("installBar");
const installBtn = document.getElementById("installBtn");
const installDismiss = document.getElementById("installDismiss");
installBtn.textContent = t("install_btn");
document.getElementById("installText").textContent = t("install_text");

window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredPrompt = e;
  if (!localStorage.getItem("waitradar_install_dismissed")){
    installBar.classList.add("show");
  }
});

installBtn?.addEventListener("click", async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  installBar.classList.remove("show");
});

installDismiss?.addEventListener("click", () => {
  installBar.classList.remove("show");
  localStorage.setItem("waitradar_install_dismissed", "1");
});

// --- PWA: iPhone/iPad no dispara beforeinstallprompt, hay que explicar el paso manual ---
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
const isStandalone = window.navigator.standalone === true;
if (isIOS && !isStandalone && !localStorage.getItem("waitradar_install_dismissed")){
  installBar.innerHTML = `
    <span>${t("install_ios")}</span>
    <span class="install-dismiss" id="installDismissIOS">✕</span>
  `;
  installBar.classList.add("show");
  document.getElementById("installDismissIOS").addEventListener("click", () => {
    installBar.classList.remove("show");
    localStorage.setItem("waitradar_install_dismissed", "1");
  });
}
</script>
