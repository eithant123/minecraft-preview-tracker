<!DOCTYPE html>
<html lang="es" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WaitRadar — Configuración</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#0c1015; --panel:#12181f;
    --grass:#5b9c3e; --grass-dark:#3d6b2a; --dirt:#7a5230; --stone:#5a626b;
    --alert:#e0453a; --sky:#4a90d9; --gold:#e8b93e;
    --text:#e8ecef; --dim:#7d8790; --line:#232d38;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--night);
    color:var(--text); font-family:'JetBrains Mono', monospace;
    display:flex; flex-direction:column; align-items:center;
  }
  header{
    width:100%; max-width:640px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:16px 20px; border-bottom:1px solid var(--line);
  }
  .header-left{ display:flex; align-items:center; gap:10px; }
  .back{ color:var(--dim); text-decoration:none; font-size:13px; }
  .brand-name{ font-family:'Press Start 2P', monospace; font-size:11px; }
  .brand-name b{ color:var(--gold); }

  .lang-switch{ display:flex; gap:4px; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:2px; }
  .lang-btn{
    font-size:10.5px; font-weight:700; padding:4px 8px; border-radius:6px; cursor:pointer;
    color:var(--dim); background:transparent; border:none; font-family:'JetBrains Mono', monospace;
  }
  .lang-btn.active{ background:var(--grass-dark); color:#fff; }

  main{ width:100%; max-width:640px; padding:20px; }

  .card{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:14px; }
  .card-title{ font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.05em; margin-bottom:14px; }

  .row{ display:flex; align-items:center; justify-content:space-between; gap:14px; padding:12px 0; border-bottom:1px solid var(--line); }
  .row:last-child{ border-bottom:none; }
  .row-label{ font-size:12.5px; }
  .row-desc{ font-size:10.5px; color:var(--dim); margin-top:3px; }

  .switch{ width:42px; height:24px; border-radius:20px; background:#2a3441; position:relative; flex-shrink:0; cursor:pointer; border:1px solid var(--line); transition:background .2s; }
  .switch.on{ background:var(--grass-dark); }
  .switch::after{ content:""; position:absolute; top:2px; left:2px; width:18px;height:18px; border-radius:50%; background:#8b97a6; transition:left .2s, background .2s; }
  .switch.on::after{ left:20px; background:#fff; }

  input[type=time]{
    background:var(--night); color:var(--text); border:1px solid var(--line);
    border-radius:6px; padding:6px 10px; font-family:'JetBrains Mono', monospace; font-size:12px;
  }

  .mute-btns{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .mute-btn{
    font-size:11px; padding:8px 12px; border-radius:8px; cursor:pointer;
    background:var(--night); border:1px solid var(--line); color:var(--text);
  }
  .mute-status{ font-size:10.5px; color:var(--dim); margin-top:10px; }

  .profile-card{ display:flex; align-items:center; gap:12px; margin-bottom:14px; }
  .profile-card img{ width:48px; height:48px; border-radius:50%; border:2px solid var(--line); flex-shrink:0; }
  .profile-card img.premium{ border-color:var(--gold); box-shadow:0 0 14px rgba(232,185,62,.5); }
  .profile-card .avatar-fallback{
    width:48px; height:48px; border-radius:50%; flex-shrink:0;
    background:rgba(74,144,217,.15); border:2px solid rgba(74,144,217,.4);
    display:flex; align-items:center; justify-content:center; font-size:19px; color:var(--sky); font-weight:700;
  }
  .profile-card .avatar-fallback.premium{
    border-color:var(--gold); box-shadow:0 0 14px rgba(232,185,62,.5);
    background:rgba(232,185,62,.15); color:var(--gold);
  }
  .name-row{ display:flex; align-items:center; gap:6px; }
  .profile-card .name{ font-size:14px; font-weight:700; color:#fff; }
  .profile-badge{
    font-size:8.5px; padding:2px 7px; border-radius:20px; font-weight:700;
    background:linear-gradient(90deg, var(--gold), #f0d078); color:#1a1408;
  }
  .profile-card .handle{ font-size:11px; color:var(--dim); margin-top:2px; }
  .profile-card .logout-btn{ margin-left:auto; }
  .logout-btn{
    font-size:10.5px; color:var(--dim); background:none; border:none; cursor:pointer;
    text-decoration:underline; padding:0;
  }

  .premium-tag{
    display:inline-block; font-size:9.5px; padding:3px 8px; border-radius:20px;
    background:rgba(232,185,62,.12); color:var(--gold); border:1px solid rgba(232,185,62,.4);
  }
  .free-note{ font-size:10.5px; color:var(--dim); margin-top:10px; line-height:1.5; }
  .upsell-title{ font-size:14px; font-weight:700; color:#fff; margin-bottom:8px; }
  .upsell-list{ font-size:11.5px; color:var(--text); line-height:2; margin:0 0 14px; padding:0; }
  .upsell-list li{ list-style:none; }
  .price-options{ display:flex; gap:8px; margin-bottom:14px; }
  .price-card{
    flex:1; background:var(--night); border:1px solid var(--line); border-radius:10px;
    padding:10px 6px; text-align:center; position:relative;
    text-decoration:none; display:block; transition:background .15s;
  }
  .price-card:active{ background:#1a2028; }
  .price-card.best{ border-color:var(--gold); }
  .price-card .best-tag{
    position:absolute; top:-9px; left:50%; transform:translateX(-50%);
    background:var(--gold); color:#1a1408; font-size:8px; font-weight:700;
    padding:2px 6px; border-radius:20px; white-space:nowrap;
  }
  .price-card .amount{ font-family:'Press Start 2P', monospace; font-size:15px; color:var(--gold); margin:5px 0 3px; }
  .price-card .period{ font-size:9.5px; color:var(--dim); }
  .upsell-note{ font-size:10px; color:var(--dim); line-height:1.5; margin-bottom:10px; }
  .upsell-btn{
    display:block; text-align:center; padding:12px; border-radius:8px;
    background:linear-gradient(90deg, var(--gold), #f0d078); color:#1a1408;
    font-weight:700; font-size:12.5px; text-decoration:none;
  }
  .premium-expiry{ font-size:10.5px; color:var(--dim); margin-top:8px; }
  .discord-id-row{ margin-top:14px; padding-top:14px; border-top:1px solid var(--line); }
  .discord-id-label{ font-size:11.5px; margin-bottom:6px; }
  .discord-id-help{ font-size:10px; color:var(--dim); line-height:1.5; margin-bottom:10px; }
  .discord-id-input-row{ display:flex; gap:8px; }
  #discordIdInput{
    flex:1; background:var(--night); color:var(--text); border:1px solid var(--line);
    border-radius:6px; padding:8px 10px; font-family:'JetBrains Mono', monospace; font-size:12px;
  }
  #discordIdSaveBtn{
    background:#5865F2; color:#fff; border:none; border-radius:6px; padding:8px 14px;
    font-size:11px; font-weight:700; cursor:pointer; flex-shrink:0;
  }
  #discordIdSaveBtn.saved{ background:var(--grass-dark); }

  .login-card{ text-align:center; padding:30px 20px; }
  .login-card p{ font-size:12px; color:var(--dim); line-height:1.6; margin-bottom:20px; }
  #telegramWidget{ display:flex; justify-content:center; }

  .load-msg{ text-align:center; color:var(--dim); font-size:11px; padding:40px 20px; }
</style>
</head>

function getLang(){
  const saved = localStorage.getItem("waitradar_lang");
  if (saved) return saved;
  return navigator.language.startsWith("en") ? "en" : "es";
}
let currentLang = getLang();
function t(key, ...args){
  const val = I18N[currentLang][key];
  return typeof val === "function" ? val(...args) : val;
}

function setLang(lang){
  currentLang = lang;
  localStorage.setItem("waitradar_lang", lang);
  document.getElementById("htmlRoot").lang = lang;
  document.getElementById("langEs").classList.toggle("active", lang === "es");
  document.getElementById("langEn").classList.toggle("active", lang === "en");
  document.getElementById("backLink").textContent = t("back");
  document.getElementById("headerSub").textContent = t("header_sub");
  if (prefs) render();
  else if (!user) renderLogin();
  else document.getElementById("loadMsg").textContent = t("loading_prefs");
}

document.getElementById("langEs").addEventListener("click", () => setLang("es"));
document.getElementById("langEn").addEventListener("click", () => setLang("en"));

function init(){
  const saved = localStorage.getItem("waitradar_tg_user");
  if (saved){
    user = JSON.parse(saved);
    loadPrefsAndRender();
  } else {
    renderLogin();
  }
}

function renderLogin(){
  const main = document.getElementById("main");
  main.innerHTML = `
    <div class="card login-card">
      <div class="card-title">${t("login_title")}</div>
      <p>${t("login_text")}</p>
      <div id="telegramWidget"></div>
    </div>
  `;
  const script = document.createElement("script");
  script.src = "https://telegram.org/js/telegram-widget.js?22";
  script.setAttribute("data-telegram-login", BOT_USERNAME);
  script.setAttribute("data-size", "large");
  script.setAttribute("data-radius", "8");
  script.setAttribute("data-onauth", "onTelegramAuth(user)");
  script.setAttribute("data-request-access", "write");
  script.async = true;
  document.getElementById("telegramWidget").appendChild(script);
}

window.onTelegramAuth = function(tgUser){
  user = tgUser;
  localStorage.setItem("waitradar_tg_user", JSON.stringify(user));
  loadPrefsAndRender();
};

async function loadPrefsAndRender(){
  const main = document.getElementById("main");
  main.innerHTML = `<div class="load-msg">${t("loading_prefs")}</div>`;

  let { data, error } = await sb.from("user_prefs").select("*").eq("telegram_id", user.id).maybeSingle();

  if (!data){
    const insertRes = await sb.from("user_prefs").insert({
      telegram_id: user.id,
      telegram_username: user.username || null,
      telegram_first_name: (user.first_name || "") + (user.last_name ? " " + user.last_name : "") || null
    }).select().single();
    data = insertRes.data;
    error = insertRes.error;
  }

  if (error || !data){
    main.innerHTML = `<div class="load-msg">${t("db_error")}</div>`;
    console.error(error);
    return;
  }
  prefs = data;
  render();
}

function isPremiumActive(){
  if (!prefs.is_premium) return false;
  if (!prefs.premium_hasta) return true; // sin fecha = de por vida
  return new Date(prefs.premium_hasta) > new Date();
}

      </div>
      <div class="mute-status" id="muteStatus">${muteStatusText()}</div>
    </div>
  `;

  document.getElementById("logoutBtn").addEventListener("click", () => {
    localStorage.removeItem("waitradar_tg_user");
    user = null; prefs = null;
    renderLogin();
  });

  document.getElementById("discordIdSaveBtn")?.addEventListener("click", () => {
    const input = document.getElementById("discordIdInput");
    prefs.discord_user_id = input.value.trim() || null;
    savePrefs();
    const btn = document.getElementById("discordIdSaveBtn");
    btn.textContent = t("discord_id_saved");
    btn.classList.add("saved");
    setTimeout(() => { btn.textContent = t("discord_id_save"); btn.classList.remove("saved"); }, 1500);
  });

  main.querySelectorAll(".switch").forEach(sw => {
    sw.addEventListener("click", () => {
      const key = sw.dataset.key;
      prefs[key] = !prefs[key];
      render();
      savePrefs();
    });
  });

  document.getElementById("quietStart").addEventListener("change", (e) => {
    prefs.quiet_hours_start = e.target.value;
    savePrefs();
  });
  document.getElementById("quietEnd").addEventListener("change", (e) => {
    prefs.quiet_hours_end = e.target.value;
    savePrefs();
  });

  main.querySelectorAll(".mute-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const hours = parseInt(btn.dataset.hours, 10);
      prefs.muted_until = hours === 0 ? null : new Date(Date.now() + hours * 3600000).toISOString();
      render();
      savePrefs();
    });
  });
}

async function savePrefs(){
  const { telegram_id, created_at, ...fields } = prefs;
  const { error } = await sb.from("user_prefs").update(fields).eq("telegram_id", user.id);
  if (error) console.error("Error guardando:", error);
}

function muteStatusText(){
  if (!prefs.muted_until) return t("not_muted");
  const until = new Date(prefs.muted_until);
  if (until < new Date()) return t("not_muted");
  return t("muted_until", until.toLocaleString(t("locale")));
}

setLang(currentLang);
init();
</script>
</body>
</html>
